[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-article-gate"
version = "0.1.0"
description = "Decide which travel blog articles are bookable trips, then extract grounded places and activities."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Samuel Aguda" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
langfuse = ["langfuse>=2.50,<3"]
trafilatura = ["trafilatura>=1.12"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
article-gate = "article_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
article_gate = ["prompts/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
